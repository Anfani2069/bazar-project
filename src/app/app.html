@if (!isAdmin()) {
  <app-header />
}

@if (isAdmin()) {
  <router-outlet />
} @else {
  <main class="min-h-screen bg-surface-alt">
    <router-outlet />
  </main>
}

@if (!isAdmin()) {
  <app-footer />
}

<ui-toast />

@if (showCartFab()) {
  <a routerLink="/panier"
     class="sm:hidden fixed bottom-5 right-5 z-50 flex items-center justify-center
            w-14 h-14 rounded-full bg-primary text-white shadow-xl
            active:scale-95 transition-transform"
     aria-label="Mon panier">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
    </svg>
    @if (cartCount() > 0) {
      <span class="absolute -top-1 -right-1 min-w-[22px] h-[22px] bg-accent text-primary
                   text-xs font-black rounded-full flex items-center justify-center px-1 leading-none
                   ring-2 ring-white">
        {{ cartCount() }}
      </span>
    }
  </a>
}
